[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
macro_rules_attribute = "0.2"
paste = "1.0"
slab = "0.4.12"
rustc-hash = "2.1.3"

[target.'cfg(all(not(target_arch = "wasm32"), target_pointer_width = "64"))'.dependencies]
cranelift = { version = "0.133.1", features = ["jit", "module", "native"], optional = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"

[features]
# default = ["jit"]
jit = ["dep:cranelift"]
